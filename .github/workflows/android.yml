name: Android
on:
  push:
    branches: [master, feat/native-android]
  pull_request:
    paths: ['android/**', '.gitmodules', '.github/workflows/android.yml']
jobs:
  android-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned native tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Test, lint and build
        working-directory: android
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/core/build/reports/tests
            android/app/build/reports
      - uses: actions/upload-artifact@v4
        with:
          name: distillpod-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build shared native bridge and run validation
        run: |
          cmake -S android/app/src/main/cpp -B /tmp/distillpod-native -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/distillpod-native -j4
          ctest --test-dir /tmp/distillpod-native --output-on-failure
  emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare verified public inference fixtures
        run: |
          mkdir -p /tmp/distillpod-fixtures
          curl -fL --retry 3 https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin -o /tmp/distillpod-fixtures/ggml-tiny.en.bin
          printf '%s\n' '921e4cf8686fdd993dcd081a5da5b6c365bfde1162e72b08d75ac75289920b1f  /tmp/distillpod-fixtures/ggml-tiny.en.bin' | sha256sum -c -
          curl -fL --retry 3 https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin -o /tmp/distillpod-fixtures/ggml-tiny.bin
          printf '%s\n' 'be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21  /tmp/distillpod-fixtures/ggml-tiny.bin' | sha256sum -c -
          cp android/third_party/whisper.cpp/samples/jfk.wav /tmp/distillpod-fixtures/jfk.wav
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: DISTILLPOD_SERIAL=emulator-5554 android/scripts/emulator-tests.sh /tmp/distillpod-fixtures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test-results
          path: /tmp/distillpod-instrumentation.log
