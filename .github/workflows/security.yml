name: Repository security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-security:
    name: Secrets and personal data guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate data guard
        run: python3 -m unittest discover -s scripts -p 'test_repository_data_guard.py'
      - name: Reject personal data containers and unreviewed media
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/repository_data_guard.py --base "${BASE_SHA:-}"
      - name: Install verified secret scanner
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/distillpod-gitleaks"
          mkdir -p "$scanner_dir"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
      - name: Verify credential format coverage
        run: python3 scripts/verify_secret_rules.py --gitleaks "$RUNNER_TEMP/distillpod-gitleaks/gitleaks"
      - name: Scan fetched Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/distillpod-gitleaks/gitleaks" git . \
            --log-opts='--all --full-history' --redact=100 \
            --max-decode-depth=3 --max-archive-depth=3
