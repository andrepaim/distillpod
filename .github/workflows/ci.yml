name: Android CI

on:
  push:
    branches: [main]
    # Documentation only; do not ignore entire directories or code/config formats.
    paths-ignore:
      - '**.md'
      - 'docs/**/*.png'
      - 'docs/**/*.mp4'
      - 'docs/android/evidence/**/*.json'
      - 'docs/android/evidence/**/*.jsonl'
      - 'docs/android/evidence/**/*.txt'
      - 'design/icon-proposal/assets/Manrope-OFL.txt'
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      build_release:
        type: boolean
        default: false
    secrets:
      FIREBASE_CONFIG_JSON:
        required: false
      SENTRY_DSN:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select validation and check documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      docs_validated: ${{ steps.select.outputs.docs_validated }}
      checkout_sha: ${{ steps.select.outputs.checkout_sha }}
      changed_count: ${{ steps.select.outputs.changed_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test validation routing and documentation checks
        run: |
          python3 -m unittest discover -s scripts -p 'test_ci_validation.py'
          python3 -m unittest discover -s scripts -p 'test_docs_validation.py'
      - name: Select from the complete PR diff
        id: select
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_INPUTS_CONTEXT: ${{ toJSON(inputs) }}
        run: python3 scripts/ci_validation.py select

  security:
    name: Repository security
    # Direct pushes already start security.yml, including documentation-only pushes.
    # Reusable calls inherit caller events, but have a nonempty inputs contract.
    if: github.event_name != 'push' || toJSON(inputs) != '{}'
    uses: ./.github/workflows/security.yml

  firebase:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    name: Firebase protocol and security rules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked emulator tools
        run: npm ci --prefix firebase --ignore-scripts --no-audit --no-fund
      - name: Validate isolated transactions and rules
        run: |
          npm --prefix firebase run test:emulator
          npm --prefix firebase run test:storage

  android_build:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    name: Android build validation
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install pinned native tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Validate release tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test, lint and build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fetch_youtube_extractor.py --output app/build/generated/youtube/res/raw/ytdlp.bin
          ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Validate opt-in voice configuration
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug -PdistillpodVoiceEnabled=true
          ./gradlew --no-daemon :app:assembleDebug
      - name: Build unsigned distribution candidate
        if: inputs.build_release == true
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${FIREBASE_CONFIG_JSON:?Missing Firebase client configuration for distribution}"
          : "${SENTRY_DSN:?Missing Sentry DSN for cloud diagnostics distribution}"
          config_file="$RUNNER_TEMP/distillpod-google-services.json"
          trap 'rm -f "$config_file"' EXIT
          umask 077
          printf '%s' "$FIREBASE_CONFIG_JSON" > "$config_file"
          ./gradlew --no-daemon :app:lintRelease :app:assembleRelease -PdistillpodVoiceEnabled=true "-PdistillpodFirebaseConfig=$config_file"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-reports
          path: |
            core/build/reports/tests
            app/build/reports
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distillpod-debug-test-build
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.build_release == true
        with:
          name: distillpod-unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  native:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    name: Native bridge validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build and test host bridge
        run: |
          cmake -S app/src/main/cpp -B /tmp/distillpod-native -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/distillpod-native --parallel 2
          ctest --test-dir /tmp/distillpod-native --output-on-failure

  emulator:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    name: Isolated Android acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Retain Firebase emulator runtime
        run: echo "DISTILLPOD_FIREBASE_JAVA=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install cloud emulator tools
        run: npm ci --prefix firebase --ignore-scripts --no-audit --no-fund
      - name: Prepare verified public inference fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fetch_youtube_extractor.py --output app/build/generated/youtube/res/raw/ytdlp.bin
          scripts/prepare-fixtures.sh /tmp/distillpod-fixtures
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            DISTILLPOD_SERIAL=emulator-5554 scripts/startup56-emulator-tests.sh
            DISTILLPOD_SERIAL=emulator-5554 scripts/emulator-tests.sh /tmp/distillpod-fixtures
            JAVA_HOME="$DISTILLPOD_FIREBASE_JAVA" PATH="$DISTILLPOD_FIREBASE_JAVA/bin:$PATH" firebase/node_modules/.bin/firebase --config firebase/firebase.json emulators:exec --only auth,firestore,storage --project demo-distillpod-sync 'env DISTILLPOD_SERIAL=emulator-5554 scripts/sync-device-tests.sh'
            DISTILLPOD_SERIAL=emulator-5554 scripts/voice-device-tests.sh /tmp/distillpod-fixtures
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: emulator-test-results
          path: |
            /tmp/distillpod-notification-*.log
            /tmp/distillpod-instrumentation*.log
            /tmp/distillpod-sync-device.log*
            /tmp/distillpod-voice-device.log
            /tmp/distillpod-startup56-device.log
          retention-days: 14

  android:
    # Preserve this required context; it now verifies all selected dependencies.
    name: Kotlin, lint and APK
    if: always()
    needs: [plan, security, android_build, firebase, native, emulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful selected validation
        env:
          WORKFLOW_INPUTS_CONTEXT: ${{ toJSON(inputs) }}
          VALIDATION_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_validation.py gate
