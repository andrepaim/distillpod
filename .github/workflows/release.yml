name: Publish APK

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Verify tagged source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require matching version on main history
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python3 scripts/release_metadata.py --tag "$GITHUB_REF_NAME"

  validation:
    needs: source
    uses: ./.github/workflows/ci.yml
    with:
      build_release: true
    secrets:
      FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

  publish:
    name: Sign and publish alpha APK
    needs: [source, validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: alpha-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distillpod-unsigned-release
          path: unsigned
      - name: Validate, align and sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ALPHA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ALPHA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALPHA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALPHA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing alpha signing keystore}"
          : "${KEYSTORE_PASSWORD:?Missing alpha signing password}"
          : "${KEY_ALIAS:?Missing alpha signing alias}"
          : "${KEY_PASSWORD:?Missing alpha signing key password}"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          candidate=unsigned/app-release-unsigned.apk
          python3 scripts/release_metadata.py --tag "$GITHUB_REF_NAME" --apk "$candidate" --build-tools "$tools"
          signing_file="$RUNNER_TEMP/distillpod-alpha.keystore"
          trap 'rm -f "$signing_file"' EXIT
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_file"
          mkdir -p dist
          apk="dist/distillpod-${GITHUB_REF_NAME#v}.apk"
          "$tools/zipalign" -P 16 -f 4 "$candidate" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$signing_file" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/zipalign" -c -P 16 4 "$apk"
          python3 scripts/release_metadata.py --tag "$GITHUB_REF_NAME" --apk "$apk" --build-tools "$tools" --verify-signature > dist/build-info.json
          python3 -c 'import json,os,pathlib;p=pathlib.Path("dist/build-info.json");d=json.loads(p.read_text());d["commit"]=os.environ["GITHUB_SHA"];d["workflowRun"]=os.environ["GITHUB_SERVER_URL"]+"/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"];p.write_text(json.dumps(d,indent=2)+"\n")'
      - name: Package corresponding sources and notices
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/source_distribution.py --version "${GITHUB_REF_NAME#v}" --output "dist/distillpod-${GITHUB_REF_NAME#v}-source.tar.gz"
          cp THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          cp app/src/main/assets/licenses/source-manifest.json dist/source-manifest.json
          (cd dist && sha256sum *.apk *.tar.gz build-info.json THIRD_PARTY_NOTICES.md source-manifest.json > SHA256SUMS)
      - name: Publish prerelease with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "DistillPod $GITHUB_REF_NAME" --notes-file docs/releases/current.md --prerelease --draft dist/*.apk dist/*.tar.gz dist/SHA256SUMS dist/build-info.json dist/THIRD_PARTY_NOTICES.md dist/source-manifest.json
          gh release edit "$GITHUB_REF_NAME" --draft=false
