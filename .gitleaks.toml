title = "DistillPod secret detection"

[extend]
useDefault = true

[[rules]]
id = "anthropic-oauth-token"
description = "Anthropic OAuth token"
regex = '''sk-ant-oat[0-9]{2}-[A-Za-z0-9_-]{32,}'''
keywords = ["sk-ant-oat"]

[[rules]]
id = "telegram-bot-token"
description = "Telegram bot token"
regex = '''[0-9]{8,12}:[A-Za-z0-9_-]{35}'''

[[rules]]
id = "tavily-api-token"
description = "Tavily API token"
regex = '''tvly-[A-Za-z0-9_-]{20,}'''
keywords = ["tvly-"]
