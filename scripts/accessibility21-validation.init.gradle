// Fresh offline application for deliberate accessibility acceptance only.
allprojects {
    afterEvaluate {
        if (path == ':app') {
            if (System.getenv('SENTRY_DSN')) throw new GradleException('Validation requires empty SENTRY_DSN')
            if (project.hasProperty('distillpodFirebaseConfig')) throw new GradleException('Validation forbids Firebase configuration')
            android.defaultConfig.applicationId = 'dev.distillpod.android.validation.accessibility21'
            android.defaultConfig.testApplicationId = 'dev.distillpod.android.validation.accessibility21.test'
            android.sourceSets.debug.manifest.srcFile('src/validationAccessibility21/AndroidManifest.xml')
            android.sourceSets.androidTest.manifest.srcFile('src/validationAccessibility21/AndroidManifest.xml')
        }
    }
}
