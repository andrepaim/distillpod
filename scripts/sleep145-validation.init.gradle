// Offline, separately installed sleep timer probe (#145). Never use for production.
allprojects {
    afterEvaluate {
        if (path == ':app') {
            if (System.getenv('SENTRY_DSN')) throw new GradleException('Validation requires empty SENTRY_DSN')
            if (project.hasProperty('distillpodFirebaseConfig')) throw new GradleException('Validation forbids Firebase configuration')
            android.defaultConfig.applicationId = project.findProperty('sleep145Package') ?: 'dev.distillpod.android.validation.sleep145'
            if (!android.defaultConfig.applicationId.startsWith('dev.distillpod.android.validation.sleep145'))
                throw new GradleException('Validation package must be dev.distillpod.android.validation.sleep145*')
            android.sourceSets.debug.java.srcDir('src/validationSleep145/java')
            android.sourceSets.debug.manifest.srcFile('src/validationSleep145/AndroidManifest.xml')
        }
    }
}
