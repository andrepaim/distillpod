// Deliberate isolated offline validation; never apply to a production build.
allprojects {
    afterEvaluate {
        if (path == ':app') {
            if (System.getenv('SENTRY_DSN')) throw new GradleException('Validation requires an empty SENTRY_DSN')
            if (project.hasProperty('distillpodFirebaseConfig')) throw new GradleException('Validation forbids Firebase configuration')
            android.defaultConfig.applicationId = 'dev.distillpod.android.validation.voice57'
            android.defaultConfig.testApplicationId = 'dev.distillpod.android.validation.voice57.test'
            android.sourceSets.debug.manifest.srcFile('src/validationVoice57/AndroidManifest.xml')
        }
    }
}
