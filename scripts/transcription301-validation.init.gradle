// Separately installed background transcription build (#301). Never use for production.
// The owner's dev.distillpod.android installation is never touched: this build has its own package,
// its own data and no Sentry or Firebase configuration. It needs the network for a model and a public episode.
allprojects {
    afterEvaluate {
        if (path == ':app') {
            if (System.getenv('SENTRY_DSN')) throw new GradleException('Validation requires empty SENTRY_DSN')
            if (project.hasProperty('distillpodFirebaseConfig')) throw new GradleException('Validation forbids Firebase configuration')
            android.buildTypes.debug.applicationIdSuffix = '.validation.transcription301'
            android.sourceSets.debug.manifest.srcFile('src/validationTranscription301/AndroidManifest.xml')
        }
    }
}
