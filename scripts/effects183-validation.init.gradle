// Offline, separately installed playback effects probe (#183). Never use for production.
allprojects {
    afterEvaluate {
        if (path == ':app') {
            if (System.getenv('SENTRY_DSN')) throw new GradleException('Validation requires empty SENTRY_DSN')
            if (project.hasProperty('distillpodFirebaseConfig')) throw new GradleException('Validation forbids Firebase configuration')
            android.defaultConfig.applicationId = project.findProperty('effects183Package') ?: 'dev.distillpod.android.validation.effects183'
            if (!android.defaultConfig.applicationId.startsWith('dev.distillpod.android.validation.effects183'))
                throw new GradleException('Validation package must be dev.distillpod.android.validation.effects183*')
            android.sourceSets.debug.java.srcDir('src/validationEffects183/java')
            android.sourceSets.debug.manifest.srcFile('src/validationEffects183/AndroidManifest.xml')
        }
    }
}
