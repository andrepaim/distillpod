// Separately installed offline playback audio ownership validation; never target the production app.
allprojects {
    afterEvaluate {
        if (path == ':app') {
            if (System.getenv('SENTRY_DSN')) throw new GradleException('Validation requires empty SENTRY_DSN')
            if (project.hasProperty('distillpodFirebaseConfig')) throw new GradleException('Validation forbids Firebase configuration')
            android.defaultConfig.applicationId = 'dev.distillpod.android.validation.playback60'
            android.defaultConfig.testApplicationId = 'dev.distillpod.android.validation.playback60.test'
            android.sourceSets.debug.manifest.srcFile('src/validationPlayback60/AndroidManifest.xml')
            android.sourceSets.androidTest.manifest.srcFile('src/validationPlayback60/AndroidManifest.xml')
        }
    }
}
